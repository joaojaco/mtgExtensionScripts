<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ferramentas MTG</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 16px;
      width: 220px;
      box-sizing: border-box;
    }
    h3 {
      margin-top: 0;
      font-size: 14px;
      text-align: center;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button.secundario {
      background: #374151;
      margin-bottom: 0;
    }
    button.secundario:hover {
      background: #4b5563;
    }
  </style>
</head>
<body>
  <h3>Ferramentas MTG</h3>
  <button id="btnSets">Trocar Set do Deck</button>
  <button id="btnCalc" class="secundario">Calculadora de Mana</button>

  <script src="popup.js"></script>
</body>
</html>
