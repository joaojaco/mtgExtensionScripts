<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Busca Inteligente (Scryfall + IA)</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .card-section {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #94a3b8;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      box-sizing: border-box;
      font-size: 13px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .status-msg {
      font-size: 12px;
      margin-top: 8px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-success { color: #4ade80; }
    .status-error { color: #f87171; }
  </style>
</head>
<body>

  <h2>✨ Busca Inteligente (Scryfall + IA)</h2>

  <div class="card-section">
    <label for="nlpQueryInput">O que você procura?</label>
    <input type="text" id="nlpQueryInput" placeholder="Ex: remoção branca instantânea até 2 mana...">
    <button id="btnBuscarNlp">Buscar no Scryfall</button>
    <div id="nlpStatus" class="status-msg"></div>
  </div>

  <div class="card-section">
    <label for="apiKeyInput">🔑 Gemini API Key</label>
    <input type="password" id="apiKeyInput" placeholder="Cole sua Gemini API Key aqui">
    <button id="btnSalvarKey" class="btn-secondary">Salvar & Validar Chave</button>
    <div id="keyStatus" class="status-msg"></div>
  </div>

  <script src="geminiSearch.js"></script>
  <script src="buscaIA.js"></script>
</body>
</html>
