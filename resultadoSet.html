<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Resultado da Troca de Sets</title>
  <style>
    :root { color-scheme: light dark; }
    
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font: 13px system-ui, sans-serif;
      box-sizing: border-box;
      background: Canvas;
      color: CanvasText;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .conteudo {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label { font-weight: 600; }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 250px;
      box-sizing: border-box;
      font: 12px monospace;
      resize: vertical;
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 8px;
    }

    .rodape-fixo {
      padding: 10px 14px;
      background: Canvas;
      border-top: 1px solid #444;
      display: flex;
      justify-content: flex-end;
    }

    #copiar {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #copiar:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="conteudo">
    <label for="saida">📋 Lista Gerada:</label>
    <textarea id="saida" readonly placeholder="Carregando lista..."></textarea>
  </div>

  <div class="rodape-fixo">
    <button id="copiar">📋 Copiar resultado</button>
  </div>

  <script src="resultadoSet.js"></script>
</body>
</html>
