<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Trocar set do deck</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 14px; font: 13px system-ui, sans-serif; box-sizing: border-box; }
    label { display: block; margin: 10px 0 3px; font-weight: 600; }
    textarea {
      width: 100%; min-height: 120px; box-sizing: border-box;
      font: 12px monospace; resize: vertical;
    }
    input[type=text] { padding: 4px; box-sizing: border-box; }
    #filtroSets { width: 100%; margin-top: 4px; }
    #listaTipos {
      display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 4px;
    }
    #listaTipos label { margin: 0; padding: 2px 0; font-weight: normal; cursor: pointer; }
    #listaSets {
      border: 1px solid #888; border-radius: 4px; margin-top: 4px;
      height: 180px; min-height: 60px; overflow-y: auto; padding: 2px 0;
      resize: vertical; /* alça de resize manual no canto inferior direito */
    }
    .set {
      display: flex; gap: 6px; align-items: center; margin: 0;
      padding: 3px 6px; font-weight: normal; cursor: pointer;
    }
    .set:hover { background: rgba(128, 128, 128, 0.2); }
    .set .cont { margin-left: auto; opacity: 0.7; white-space: nowrap; }
    .vazio { padding: 6px; opacity: 0.7; }
    .prioridade { margin-top: 4px; font-size: 12px; opacity: 0.85; }
    .opcao { font-weight: normal; margin: 6px 0 0; }
    button { margin-top: 10px; padding: 6px 12px; cursor: pointer; }
    #limparSets { margin-top: 6px; padding: 3px 10px; font-size: 12px; }
        #status {
      position: sticky; bottom: 0; margin-top: 10px; padding: 8px 0;
      white-space: pre-wrap; max-height: 40vh; overflow-y: auto;
      background: Canvas; color: CanvasText; border-top: 1px solid #888;
    }
  </style>
</head>
<body>
  <label for="entrada">Lista do deck (texto exportado do Archidekt)</label>
  <textarea id="entrada" placeholder="1x Sol Ring (c21) [Ramp]&#10;1x Arcane Signet (eld)"></textarea>

  <label class="opcao"><input type="checkbox" id="basicos"> incluir terrenos básicos</label>
  <button id="carregar">1. Carregar sets disponíveis</button>

  <label>Versões da arte (marque na ordem de prioridade)</label>
  <div id="listaTipos">
    <label><input type="checkbox" value="full"> Full art</label>
    <label><input type="checkbox" value="extended"> Extended art</label>
    <label><input type="checkbox" value="showcase"> Showcase</label>
    <label><input type="checkbox" value="borderless"> Borderless</label>
    <label><input type="checkbox" value="normal"> Normal</label>
    <label><input type="checkbox" value="qualquer"> Qualquer versão</label>
  </div>
  <div class="prioridade" id="prioridadeTipos"></div>

  <label for="filtroSets">Sets disponíveis (marque um ou mais, na ordem de prioridade)</label>
  <input type="text" id="filtroSets" placeholder="filtrar por código ou nome...">
  <div id="listaSets"><div class="vazio">Cole a lista e clique em "Carregar sets disponíveis".</div></div>
  <div class="prioridade" id="prioridade"></div>
  <button id="limparSets" type="button">Limpar sets marcados</button>

  <label class="opcao"><input type="checkbox" id="fallback" checked> se nenhuma versão marcada existir, usar a normal</label>

  <button id="gerar">2. Gerar lista</button>

  <label for="saida">Resultado</label>
  <textarea id="saida" readonly></textarea>
  <button id="copiar">Copiar resultado</button>

  <div id="status"></div>
  <script src="setSelector.js"></script>
</body>
</html>
